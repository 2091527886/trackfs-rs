[package]
name = "trackfs-rs"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env"] }
concurrent_lru = "0.2.0"
cue-rw = { path = "cue-rw" }
dashmap = "6.1.0"
deadpool = "0.12.3"
encoding_rs = "0.8.35"
fuser = "0.16.0"
futures = "0.3.31"
image = "0.25.8"
itertools = "0.14.0"
libc = "0.2.177"
libflac-sys = "0.3.1"
num_cpus = "1.17.0"
num_enum = "0.7.4"
num-rational = "0.4.2"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls"] }
# memmap2 removed

[profile.dev]
overflow-checks = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 保留 debuginfo 以便分析（2 表示完整的 DWARF 调试信息）
debug = 2
# 禁止剥离符号，便于 perf/addr2line 符号解析
strip = "none"
